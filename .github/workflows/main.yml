name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            java_version: 8
          - os: ubuntu-24.04
            java_version: 11
          - os: ubuntu-24.04
            java_version: 17
          - os: macos-13
            java_version: 11
          - os: macos-15
            java_version: 11
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.1.1

      - uses: actions/setup-java@v4.0.0
        with:
          distribution: zulu
          java-version: ${{ matrix.java_version }}

      - if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          sudo apt-get -qq update &&
          sudo apt-get -qq install sox speech-tools

      - if: runner.os == 'macOS'
        run: brew install sox speech-tools

      - uses: gradle/gradle-build-action@v2.12.0
        with:
          arguments: build --warning-mode all
